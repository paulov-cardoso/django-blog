{% with moderadores=post.moderadores.all %}
{% if moderadores %}
<div class="mb-6 border border-gray-200 rounded-xl p-4 bg-gray-50">
    <h3 class="text-sm font-semibold text-gray-700 mb-2">👥 Moderadores</h3>
    <div class="flex flex-wrap gap-2">
        {% for m in moderadores %}
        {% if m.ativo %}
        <span class="bg-white border border-gray-300 text-gray-700 text-xs px-3 py-1 rounded-full">
            {{ m.autor.nome_exibicao }}
            {% if m.papel == 'dono' %}
            <span class="text-indigo-500 ml-1">• dono</span>
            {% endif %}
        </span>
        {% endif %}
        {% endfor %}
    </div>
</div>
{% endif %}
{% endwith %}
