<div id="barra-abas"
     class="sticky top-[72px] z-30 bg-white/90 border-b border-gray-200
            -mx-4 px-4 mb-8"
     style="will-change: transform; transform: translateZ(0);">

    <div class="max-w-5xl mx-auto flex justify-center">
        {% with aba_atual=aba|default:'perfil' %}

        <a href="/?aba=perfil"
           class="aba-nav group relative px-5 py-2.5 text-xs font-semibold
                  transition-colors duration-200 flex flex-col items-center gap-0.5
                  {% if aba_atual == 'perfil' %}text-indigo-600{% else %}text-gray-400 hover:text-gray-700{% endif %}">
            <span class="text-base leading-none">👤</span>
            <span class="aba-label">Perfil</span>
            <span class="absolute bottom-0 left-0 right-0 h-0.5 rounded-full
                         {% if aba_atual == 'perfil' %}bg-indigo-600{% else %}bg-transparent group-hover:bg-indigo-300{% endif %}">
            </span>
        </a>

        <a href="/?aba=notes_privados"
           class="aba-nav group relative px-5 py-2.5 text-xs font-semibold
                  transition-colors duration-200 flex flex-col items-center gap-0.5
                  {% if aba_atual == 'notes_privados' %}text-blue-600{% else %}text-gray-400 hover:text-gray-700{% endif %}">
            <span class="text-base leading-none">📓</span>
            <span class="aba-label">Notes Privados</span>
            <span class="absolute bottom-0 left-0 right-0 h-0.5 rounded-full
                         {% if aba_atual == 'notes_privados' %}bg-blue-600{% else %}bg-transparent group-hover:bg-blue-300{% endif %}">
            </span>
        </a>

        <a href="/?aba=feed"
           class="aba-nav group relative px-5 py-2.5 text-xs font-semibold
                  transition-colors duration-200 flex flex-col items-center gap-0.5
                  {% if aba_atual == 'feed' %}text-purple-600{% else %}text-gray-400 hover:text-gray-700{% endif %}">
            <span class="text-base leading-none">👥</span>
            <span class="aba-label">Feed de Ideias</span>
            <span class="absolute bottom-0 left-0 right-0 h-0.5 rounded-full
                         {% if aba_atual == 'feed' %}bg-purple-600{% else %}bg-transparent group-hover:bg-purple-300{% endif %}">
            </span>
        </a>

        <a href="/?aba=campo"
           class="aba-nav group relative px-5 py-2.5 text-xs font-semibold
                  transition-colors duration-200 flex flex-col items-center gap-0.5
                  {% if aba_atual == 'campo' %}text-orange-500{% else %}text-gray-400 hover:text-gray-700{% endif %}">
            <span class="text-base leading-none">🌍</span>
            <span class="aba-label">Campo das Ideias</span>
            <span class="absolute bottom-0 left-0 right-0 h-0.5 rounded-full
                         {% if aba_atual == 'campo' %}bg-orange-500{% else %}bg-transparent group-hover:bg-orange-300{% endif %}">
            </span>
        </a>

        <a href="/?aba=forumizacao"
           class="aba-nav group relative px-5 py-2.5 text-xs font-semibold
                  transition-colors duration-200 flex flex-col items-center gap-0.5
                  {% if aba_atual == 'forumizacao' %}text-yellow-600{% else %}text-gray-400 hover:text-gray-700{% endif %}">
            <span class="text-base leading-none">🏛️</span>
            <span class="aba-label">Forumização</span>
            <span class="absolute bottom-0 left-0 right-0 h-0.5 rounded-full
                         {% if aba_atual == 'forumizacao' %}bg-yellow-500{% else %}bg-transparent group-hover:bg-yellow-300{% endif %}">
            </span>
        </a>

        {% endwith %}
    </div>
</div>

<style>
.aba-label {
    transition: none;
}
</style>
