<div id="modal-excluir-{{ post.id }}"
     class="fixed inset-0 z-[99999] hidden items-center justify-center bg-black/50">
    <div class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full mx-4">
        <h2 class="text-lg font-semibold text-gray-800 mb-2">🗑️ Excluir post?</h2>
        <p class="text-sm text-gray-600 mb-5">Este post será excluído permanentemente.</p>
        <div class="flex gap-3">
            <button onclick="fecharModal('excluir-{{ post.id }}')"
                    class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm py-2 rounded-xl transition">
                Cancelar
            </button>
            <form method="POST" action="{% url 'desistir_ideia' post.id %}" class="flex-1">
                {% csrf_token %}
                <button type="submit"
                        class="w-full bg-red-500 hover:bg-red-600 text-white text-sm py-2 rounded-xl transition">
                    Excluir
                </button>
            </form>
        </div>
    </div>
</div>
