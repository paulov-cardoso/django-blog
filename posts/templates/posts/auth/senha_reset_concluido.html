{% extends 'posts/auth/base_auth.html' %}

{% block titulo %}Senha Redefinida — Synapsoo{% endblock %}

{% block auth_content %}

<div class="text-center text-6xl mb-5" aria-hidden="true">✅</div>

<h1 class="text-center text-white font-bold text-3xl tracking-wide mb-3"
    style="font-family:'Poppins',sans-serif; text-shadow:0 2px 8px rgba(0,0,0,0.18);">
    Senha redefinida
</h1>

<p class="text-center text-sm font-light text-white/70 mb-7 leading-relaxed" style="font-family:'Poppins',sans-serif;">
    Sua senha foi alterada com sucesso. Agora você já pode acessar sua conta novamente.
</p>

<a href="{% url 'login' %}"
   class="w-full h-12 bg-white text-gray-700 font-medium text-base rounded-full
          flex items-center justify-center shadow-[0_4px_18px_rgba(0,0,0,0.18)]
          hover:bg-gray-100 active:scale-[0.98] transition duration-200"
   style="font-family:'Poppins',sans-serif;">
    Ir para o login
</a>

{% endblock %}
