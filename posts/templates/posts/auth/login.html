{% extends 'posts/auth/base_auth.html' %}

{% block titulo %}Login — Synapsoo{% endblock %}

{% block auth_content %}

<h1 class="text-center text-white font-bold text-3xl tracking-wide mb-6"
    style="font-family:'Poppins',sans-serif; text-shadow:0 2px 8px rgba(0,0,0,0.18);">
    Entrar
</h1>

{% if form.errors %}
<p role="alert"
   class="bg-red-500/20 border border-red-300/50 text-white text-xs
          font-light rounded-xl px-4 py-3 text-center mb-4"
   style="font-family:'Poppins',sans-serif;">
    Usuário/email ou senha incorretos.
</p>
{% endif %}

<form method="POST" novalidate>
    {% csrf_token %}

    <div class="relative mb-3">
        <label for="id_username" class="sr-only">Usuário ou Email</label>
        <input type="text" id="id_username" name="username"
               placeholder="Usuário ou Email" required autocomplete="username"
               class="w-full h-12 bg-white/[0.13] border border-white/25
                      rounded-xl text-white placeholder-white/55 text-sm
                      font-light pl-4 pr-11 outline-none transition duration-200
                      focus:bg-white/20 focus:border-white/55
                      shadow-[inset_0_1px_3px_rgba(0,0,0,0.10)]"
               style="font-family:'Poppins',sans-serif;">
        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-white/50 pointer-events-none" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
        </span>
    </div>

    <div class="relative mb-1">
        <label for="id_password" class="sr-only">Senha</label>
        <input type="password" id="id_password" name="password"
               placeholder="Senha" required autocomplete="current-password"
               class="w-full h-12 bg-white/[0.13] border border-white/25
                      rounded-xl text-white placeholder-white/55 text-sm
                      font-light pl-4 pr-11 outline-none transition duration-200
                      focus:bg-white/20 focus:border-white/55
                      shadow-[inset_0_1px_3px_rgba(0,0,0,0.10)]"
               style="font-family:'Poppins',sans-serif;">
        <button type="button" id="btn-toggle-senha"
                aria-label="Mostrar ou ocultar senha" aria-pressed="false" tabindex="-1"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-white/50
                       hover:text-white/90 transition bg-transparent border-none
                       cursor-pointer p-0 flex items-center">
            <svg id="icon-olho" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </button>
    </div>

    <div class="flex justify-between items-center mt-3 mb-4 text-xs font-light text-white/85"
         style="font-family:'Poppins',sans-serif;">
        <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" name="remember" class="cb-custom"> Lembrar senha
        </label>
        <a href="{% url 'password_reset' %}" class="text-white/80 hover:text-white hover:underline transition">
            Esqueceu a senha?
        </a>
    </div>

    <button type="submit"
            class="w-full h-12 bg-white text-gray-700 font-medium text-base rounded-full
                   cursor-pointer shadow-[0_4px_18px_rgba(0,0,0,0.18)]
                   hover:bg-gray-100 active:scale-[0.98] transition duration-200"
            style="font-family:'Poppins',sans-serif;">
        Login
    </button>

    <p class="text-center text-sm font-light text-white/80 mt-4" style="font-family:'Poppins',sans-serif;">
        <a href="{% url 'registrar' %}" class="font-medium text-white/90 hover:text-white hover:underline transition">
            Criar uma conta
        </a>
    </p>
</form>

<script>
document.addEventListener('DOMContentLoaded', () => {
    configurarToggleSenha('btn-toggle-senha', 'id_password', 'icon-olho');
});
</script>

{% endblock %}
