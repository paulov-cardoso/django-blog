{% extends 'posts/auth/base_auth.html' %}

{% block titulo %}Recuperar Senha — Synapsoo{% endblock %}

{% block auth_content %}

<h1 class="text-center text-white font-bold text-3xl tracking-wide mb-2"
    style="font-family:'Poppins',sans-serif; text-shadow:0 2px 8px rgba(0,0,0,0.18);">
    Esqueci a senha
</h1>

<p class="text-center text-sm font-light text-white/65 mb-6" style="font-family:'Poppins',sans-serif;">
    Digite seu email e enviaremos um link para redefinir sua senha.
</p>

<form method="POST" novalidate>
    {% csrf_token %}
    <div class="relative mb-6">
        <label for="id_email" class="sr-only">Email</label>
        <input type="email" id="id_email" name="email" placeholder="Seu email"
               required autocomplete="email"
               class="w-full h-12 bg-white/[0.13] border border-white/25 rounded-xl
                      text-white placeholder-white/55 text-sm font-light pl-4 pr-11
                      outline-none transition duration-200 focus:bg-white/20 focus:border-white/55
                      shadow-[inset_0_1px_3px_rgba(0,0,0,0.10)]"
               style="font-family:'Poppins',sans-serif;">
        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-white/50 pointer-events-none" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
            </svg>
        </span>
    </div>
    <button type="submit"
            class="w-full h-12 bg-white text-gray-700 font-medium text-base rounded-full
                   cursor-pointer shadow-[0_4px_18px_rgba(0,0,0,0.18)]
                   hover:bg-gray-100 active:scale-[0.98] transition duration-200"
            style="font-family:'Poppins',sans-serif;">
        Enviar link
    </button>
    <p class="text-center text-sm font-light text-white/80 mt-4" style="font-family:'Poppins',sans-serif;">
        Lembrou a senha?
        <a href="{% url 'login' %}" class="font-medium text-white/90 hover:text-white hover:underline transition">Entrar</a>
    </p>
</form>

{% endblock %}
