{% extends 'posts/base.html' %}

{% block titulo %}Novo Note{% endblock %}

{% block conteudo %}

<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-8">

    <h2 class="text-3xl font-bold text-gray-800 mb-6">✏️ Novo Note</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- Título -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-600 mb-1">Título</label>
            {{ form.titulo }}
        </div>

        <!-- Conteúdo -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-600 mb-1">Conteúdo</label>
            {{ form.conteudo }}
        </div>

        <!-- Categorias -->
        <div class="mb-4">
            <label class="block text-sm font-semibold text-gray-600 mb-2">Categorias</label>
            <div class="flex flex-wrap gap-2">
                {{ form.categorias }}
            </div>
        </div>

        <!-- Color Picker -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-gray-600 mb-2">Cor do card</label>
            <input type="color" name="cor" value="#3B82F6"
                   class="w-full h-12 rounded-lg cursor-pointer border border-gray-300">
        </div>

        <!-- Publicado -->
        <div class="mb-6 flex items-center gap-2">
            {{ form.publicado }}
            <label class="text-sm font-semibold text-gray-600">Publicar agora</label>
        </div>

        <button type="submit"
                class="w-full bg-blue-700 text-white py-3 rounded-lg font-semibold hover:bg-blue-800 transition">
            Salvar Note
        </button>
    </form>
</div>

{% endblock %}
